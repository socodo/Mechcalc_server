spring.datasource.url=jdbc:h2:mem:mechcalc_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

logging.level.root=WARN
logging.level.com.socodo.mechcalc=INFO

security.jwt.secret-key=test-secret-key-for-jwt-signing-should-be-at-least-32-bytes
security.jwt.expiration-time=3600000
security.jwt.refresh-token-expiration=604800000

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
